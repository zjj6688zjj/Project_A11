# =============================================================================
# BallShow Basketball Player ReID - 关键目标保障配置
# =============================================================================
# 【项目目标】
# 在300个epoch内必须达到性能要求（mAP ≥ 91.5%, Rank-1 ≥ 94.0%）
# 基于已有91.4%的mAP基础，只需提升0.1%即可达标
#
# 【性能分析】
# 1. rtx4090_final 在 epoch 153 已达标 Rank-1 94.2% ✅ (Rank-1目标已达成)
# 2. 但 mAP 始终卡在 91.1-91.4% 之间 (核心瓶颈所在)
# 3. 根源问题: 训练不稳定 + 学习率策略不当
#
# 【关键策略 - 300 epoch精细优化】
# 基于final真实数据的精准优化：
# 1. 保持final验证的最佳参数 → 不引入不必要风险
# 2. 使用余弦退火调度器 → 解决final学习率策略问题
# 3. 延长预热: 10 → 15 epoch → 提升训练稳定性
# 4. 微调数据增强: RE_PROB 0.6 → 0.5 → 避免过度信息丢失
# 5. 300 epoch → 给模型充分时间让mAP追上Rank-1
# 6. 密集监控 → 每2个epoch检查点，及时干预
# =============================================================================

MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: './weights/jx_vit_base_p16_224-80ecf9dd.pth'
  METRIC_LOSS_TYPE: 'triplet'

  # 标签平滑 - 提升泛化
  IF_LABELSMOOTH: 'on'

  # 中心损失 - 增强特征判别
  IF_WITH_CENTER: 'yes'

  # 模型架构
  NAME: 'transformer'
  NO_MARGIN: False
  DEVICE_ID: '0'
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'

  # Stride [12,12] - 保留更多细节
  STRIDE_SIZE: [12, 12]

  # 相机嵌入
  SIE_CAMERA: True
  SIE_COE: 3.0

  # 联合金字塔模块
  JPM: True
  RE_ARRANGE: True

  # 设备长度
  DEVIDE_LENGTH: 6

INPUT:
  # 【核心优化】分辨率 - 保持384×128已验证最佳
  SIZE_TRAIN: [384, 128]       # 保持final的384×128，已验证有效
  SIZE_TEST: [384, 128]

  # 【核心优化】数据增强 - 基于final优化
  PROB: 0.5                    # 保持final的0.5
  RE_PROB: 0.5                 # 从final的0.6降到0.5，减少过度擦除
  PADDING: 8                   # 保持final的8
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: 'ballshow'
  ROOT_DIR: './data'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 300              # 回归300 epoch：给模型充分时间突破瓶颈

  # 【核心优化】学习率策略 - 基于final优化
  BASE_LR: 0.01               # 保持final的0.01，已验证有效
  IMS_PER_BATCH: 96           # 保持final的96，充分利用4090

  # 【核心优化】学习率衰减 - 使用余弦退火调度器，项目只支持CosineLRScheduler

  # Warmup策略 - 适度延长预热
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 15           # 从final的10延长到15，提升稳定性
  WARMUP_FACTOR: 0.01

  # 【核心优化】正则化 - 基于final微调
  WEIGHT_DECAY: 0.00025        # 从final的0.0003微降到0.00025，减少过约束
  WEIGHT_DECAY_BIAS: 0.00025
  BIAS_LR_FACTOR: 2
  MOMENTUM: 0.9
  LARGE_FC_LR: False

  # 【密集监控】Checkpoint和日志 - 精细监控
  CHECKPOINT_PERIOD: 1         # 每1个epoch保存，及时监控训练进度
  LOG_PERIOD: 20               # 每20个epoch日志，关注进展
  EVAL_PERIOD: 1               # 每epoch评估一次，实时监控

  # 【精细调优】损失函数权重 - 采用final验证的最佳值
  CENTER_LOSS_WEIGHT: 0.001    # 恢复final的0.001，416×160不需要过强约束
  CENTER_LR: 0.5

  # 【精细调优】Margin设置 - 采用final验证的最佳值
  COSINE_MARGIN: 0.55          # 恢复final的0.55，已验证有效
  COSINE_SCALE: 32             # 恢复final的32，已验证有效
  MARGIN: 0.35                 # 恢复final的0.35，已验证有效

  # 固定种子保证可复现
  SEED: 2024

TEST:
  EVAL: True
  IMS_PER_BATCH: 512

  # 【关键优化】Re-ranking参数 - 基于final的最佳配置
  RE_RANKING: True
  K1: 25                      # final验证的最佳参数
  K2: 6
  LAMBDA: 0.95

  # 特征提取策略
  NECK_FEAT: 'after'
  FEAT_NORM: 'yes'

  WEIGHT: ''

OUTPUT_DIR: 'logs/BallShow_rtx4090_guaranteed'

# =============================================================================
# 【300 epoch监控指南】
# =============================================================================

# 【精细监控策略】
# 1. 每10个epoch保存检查点，便于回滚
# 2. 关注微观趋势：每30 epoch评估一次性能进展
# 3. 监控学习率变化：学习率按余弦曲线平滑下降

# 【300 epoch精细里程碑】
# - epoch 100: 完成第一阶段训练，mAP应 > 90.0%
# - epoch 200: 应看到mAP稳步提升到 > 91.0%
# - epoch 250: 接近瓶颈期，mAP应 > 91.3%
# - epoch 300: 最终收敛，目标mAP ≥ 91.5%, Rank-1 ≥ 94.0%

# 【动态调整策略】
# 1. 如果epoch 150时mAP < 90.5% → 考虑降低学习率到0.006
# 2. 如果epoch 200时mAP < 91.0% → 从最近检查点继续，学习率减半
# 3. 如果epoch 250时mAP < 91.3% → 从最佳检查点继续，学习率0.001
# 4. 任何时候mAP突破91.5% → 立即停止并测试！

# 【300 epoch精细保障】
# 1. 300 epoch提供充分的优化空间，避免过拟合
# 2. 余弦退火调度器确保充分收敛
# 3. 高分辨率挖掘更多图像细节
# 4. 精细调整策略允许中途优化
# 5. 基于已有91.4%的起点，300 epoch内应能达标
