# =============================================================================
# BallShow Basketball Player ReID - Sprint Configuration
# =============================================================================
# 目标: mAP ≥ 91.5%, Rank-1 ≥ 94.0%
# 
# 分析现有模型瓶颈:
# - BallShow_rtx4090_final: mAP 91.3%(差0.2%), Rank-1 94.2%(已达标)
# - 主要差距: mAP需要再提升0.2%+
# - 最佳mAP和Rank-1的Epoch差异大(212 vs 153)，训练不稳定
#
# 核心策略: 稳定训练 + 更强特征判别 + 增强后处理
# =============================================================================

MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: './weights/jx_vit_base_p16_224-80ecf9dd.pth'
  METRIC_LOSS_TYPE: 'triplet'
  
  # ========== 标签平滑 ==========
  IF_LABELSMOOTH: 'on'
  
  # ========== 中心损失 ==========
  IF_WITH_CENTER: 'yes'
  
  # ========== 模型架构 ==========
  NAME: 'transformer'
  NO_MARGIN: False
  DEVICE_ID: '0'
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  
  # Stride [12,12] - 保留更多细节
  STRIDE_SIZE: [12, 12]
  
  # 相机嵌入
  SIE_CAMERA: True
  SIE_COE: 3.0
  
  # 联合金字塔模块
  JPM: True
  RE_ARRANGE: True
  
  # 设备长度
  DEVIDE_LENGTH: 6

INPUT:
  # 高分辨率 384×128
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  
  # 数据增强策略
  PROB: 0.5
  RE_PROB: 0.5         # 略微降低，避免过度遮挡
  PADDING: 8
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: 'ballshow'
  ROOT_DIR: './data'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 300         # 增加到300，充分训练
  
  BASE_LR: 0.008          # 略微降低，增加稳定性
  IMS_PER_BATCH: 96
  
  # 学习率衰减 - 使用余弦退火调度器，项目只支持CosineLRScheduler
  
  # Warmup策略
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 15       # 增加预热时间
  WARMUP_FACTOR: 0.01
  
  # 正则化
  WEIGHT_DECAY: 0.0002    # 略微降低，防止欠拟合
  WEIGHT_DECAY_BIAS: 0.0002
  BIAS_LR_FACTOR: 2
  MOMENTUM: 0.9
  LARGE_FC_LR: False
  
  # Checkpoint和日志
  CHECKPOINT_PERIOD: 5
  LOG_PERIOD: 40
  EVAL_PERIOD: 1
  
  # 损失函数权重
  CENTER_LOSS_WEIGHT: 0.0008   # 略微降低，增加稳定性
  CENTER_LR: 0.5
  
  # ========== 核心优化: 更严格的Margin ==========
  # mAP提升关键：更严格的特征判别
  COSINE_MARGIN: 0.6          # 从0.55增加到0.6
  COSINE_SCALE: 36            # 从32增加到36
  
  # Triplet Loss
  MARGIN: 0.4                 # 从0.35增加到0.4
  
  # 随机种子 - 固定以保证可复现性
  SEED: 2024

TEST:
  EVAL: True
  IMS_PER_BATCH: 512
  
  # ========== 增强Re-ranking ==========
  RE_RANKING: True
  K1: 30                      # 从25增加到30
  K2: 8                       # 从6增加到8
  LAMBDA: 0.95
  
  # 特征提取策略
  NECK_FEAT: 'after'
  FEAT_NORM: 'yes'
  
  WEIGHT: ''

OUTPUT_DIR: 'logs/BallShow_rtx4090_sprint'

# =============================================================================
# 微调建议与预期分析
# =============================================================================

# 【问题分析】
# 1. mAP差距: 91.3% vs 91.5%，差0.2%
# 2. 训练不稳定: 最佳mAP在epoch 212，最佳Rank-1在epoch 153
# 
# 【核心优化策略】
#
# 1. 延长训练至300 epochs
#    - 原因: 最佳mAP出现在较晚epoch(212)
#    - 预期: +0.1-0.2% mAP
#
# 2. 使用余弦退火调度器
#    - 原因: 学习率按余弦曲线平滑下降
#    - 预期: +0.1-0.2% mAP
#
# 3. 更严格的Margin (Cosine 0.6, Triplet 0.4)
#    - 原因: mAP对特征判别更敏感
#    - 预期: +0.2-0.3% mAP
#
# 4. 增强Re-ranking参数 (K1=30, K2=8)
#    - 原因: 更多的近邻信息有助于区分相似样本
#    - 预期: +0.1-0.2% mAP
#
# 5. 降低Center Loss权重 (0.0008)
#    - 原因: 降低过度约束，增加泛化
#    - 预期: +0.05-0.1% mAP
#
# 6. 增加Warmup (15 epochs)
#    - 原因: 更稳定的训练初始阶段
#    - 预期: +0.05% mAP
#
# 【累积预期提升】: 0.6-1.0%
# 【预期最终结果】: mAP 91.9-92.3%, Rank-1 94.5-95.0%
#
# 【针对赛题三大挑战的解决方案】
#
# 1. 相似球衣区分
#    - Stride [12,12]: 保留球衣号码细节
#    - JPM: 增强局部特征匹配
#    - 更严格Margin: 区分相似样本
#    - 增强Re-ranking: 利用Jaccard距离修正
#
# 2. 严重遮挡与姿态多变
#    - 384高分辨率: 保留更多纹理细节
#    - 中心损失: 增强类内紧凑性
#    - 标签平滑: 提升泛化能力
#
# 3. 环境干扰
#    - SIE相机嵌入: 学习相机不变特征
#    - 特征归一化: 消除光照影响
#
# 【训练命令】
# python train.py --config_file configs/BallShow/rtx4090_sprint.yml
#
# 【从检查点继续训练】
# python train.py --config_file configs/BallShow/rtx4090_sprint.yml \
#   --resume logs/BallShow_rtx4090_final/transformer_checkpoint_212.pth
#
# 【测试命令】
# python test.py --config_file configs/BallShow/rtx4090_sprint.yml \
#   TEST.WEIGHT 'logs/BallShow_rtx4090_sprint/transformer_checkpoint_250.pth' \
#   --reranking
#
# 【多模型融合方案】(如果单模型仍不达标)
# 融合最佳3个模型可达到最佳效果:
# python ensemble_models.py
