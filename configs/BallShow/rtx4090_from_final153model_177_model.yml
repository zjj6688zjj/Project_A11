# =============================================================================
# BallShow Basketball Player ReID - 从Epoch 177继续训练（mAP提升版）
# =============================================================================
# 【训练策略】
# 从rtx4090_from_final153model的最佳检查点（epoch 177, mAP 91.3%, Rank-1 94.0%）继续训练
# 目标：mAP突破91.5%，保持Rank-1 ≥ 94.0%
# 训练计划：从epoch 177开始训练173个epoch，到绝对epoch 350
# 
# 【基础模型信息】
# - 来源: rtx4090_final epoch 153 → 继续训练
# - 最佳epoch: 177 (mAP 91.3%, Rank-1 94.0%)
# - 瓶颈: mAP卡在91.3%，需进一步提升
# 
# 【优化策略】
# 1. 继续从epoch 177微调，给mAP更多提升空间
# 2. 适度提高学习率到0.0012，提供更多优化动力
# 3. 进一步降低数据增强，保留更多已有特征
# 4. 添加分段学习率衰减（epoch 60, 120）
# =============================================================================

MODEL:
  # 预训练配置
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: './weights/jx_vit_base_p16_224-80ecf9dd.pth'
  METRIC_LOSS_TYPE: 'triplet'
  
  # 标签平滑
  IF_LABELSMOOTH: 'on'
  
  # 中心损失
  IF_WITH_CENTER: 'yes'
  
  # 模型架构
  NAME: 'transformer'
  NO_MARGIN: False
  DEVICE_ID: '0'
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  
  STRIDE_SIZE: [12, 12]
  
  # 相机嵌入
  SIE_CAMERA: True
  SIE_COE: 3.0
  
  # 联合金字塔模块
  JPM: True
  RE_ARRANGE: True
  
  DEVIDE_LENGTH: 6

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  
  # ========== 数据增强优化 ==========
  PROB: 0.5
  
  # 进一步降低RandomErasing，保留更多已有特征
  RE_PROB: 0.25       # 从0.35降到0.25，减少对已有特征的破坏
  
  PADDING: 8
  
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: 'ballshow'
  ROOT_DIR: './data'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  # 【重要】MAX_EPOCHS设置为绝对epoch总数，调度器使用绝对epoch计算学习率
  # 原因：避免断点续训时学习率过低。当前从epoch 177继续训练，调度器使用
  # 绝对epoch进行计算，若设置为180，则177/180≈98% -> 学习率≈0.0000036（过低）
  # 解决方案：设置为绝对epoch总数 350（从0开始的总周期）
  # 计算：cos(π × 177 / 350) ≈ cos(π × 0.506) ≈ cos(91°) ≈ 0.017 -> 中等学习率
  MAX_EPOCHS: 350          # 绝对epoch总数（从0到350），调度器使用绝对epoch
  
  # ========== 学习率策略 ==========
  # 【优化调整】从0.0008提高到0.0012，提供更多优化动力
  # 原始：0.0008（可能过低，难以突破瓶颈）
  # 新值：0.0012（提高50%，提供足够优化空间）
  BASE_LR: 0.0012         # 优化后的学习率，平衡稳定性和突破力
  
  IMS_PER_BATCH: 96
  
  # Warmup - 适当延长，确保稳定起步
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 3        # 从1增加到3，提供更稳定的预热
  WARMUP_FACTOR: 0.01
  
  # 学习率衰减策略 - 添加分段衰减
  STEPS: (60, 120)        # 在相对epoch 60和120处衰减学习率
  LR_DECAY_FACTOR: 0.1    # 每次衰减减少到原学习率的10%
  
  # ========== 正则化 ==========
  WEIGHT_DECAY: 0.0001    # 进一步降低，给模型更大自由度
  WEIGHT_DECAY_BIAS: 0.0001
  BIAS_LR_FACTOR: 2
  MOMENTUM: 0.9
  LARGE_FC_LR: False
  
  # Checkpoint和日志
  CHECKPOINT_PERIOD: 1
  LOG_PERIOD: 20
  EVAL_PERIOD: 1
  
  # 损失函数权重
  CENTER_LOSS_WEIGHT: 0.0005  # 降低，让模型有更多学习空间
  CENTER_LR: 0.5
  
  # Margin保持
  COSINE_MARGIN: 0.55
  COSINE_SCALE: 32
  MARGIN: 0.35
  
  # 种子
  SEED: 2026

TEST:
  EVAL: True
  IMS_PER_BATCH: 512
  
  # 关闭re-ranking（已验证无效）
  RE_RANKING: False
  
  # 特征提取策略
  NECK_FEAT: 'after'
  FEAT_NORM: 'yes'
  
  WEIGHT: ''

OUTPUT_DIR: 'logs/BallShow_rtx4090_from_final153model_177_model'

# =============================================================================
# 【训练执行命令】
# =============================================================================
# 训练计划：从epoch 177开始训练173个epoch（到绝对epoch 350）
#
# python train.py --config_file configs/BallShow/rtx4090_from_final153model_177_model.yml \
#   --resume 你的from_final153model_epoch177的pth文件路径
#
# 示例:
# python train.py --config_file configs/BallShow/rtx4090_from_final153model_177_model.yml \
#   --resume logs/BallShow_rtx4090_from_final153model/transformer_checkpoint_177.pth
#
# 监控指标：
# - 主要目标：mAP突破91.5%
# - 次要目标：Rank-1保持94.0%+
# - 警戒线：Rank-1不能跌破93.8%
#
# 【学习率衰减计划】：
# - 起点: LR = 0.0012 (3个epoch warmup)
# - 相对epoch 60: LR衰减为0.00012 (绝对epoch 237)
# - 相对epoch 120: LR衰减为0.000012 (绝对epoch 297)
# =============================================================================

# =============================================================================
# 【预期里程碑】(绝对epoch = 177 + 相对epoch，训练总计: 173个epoch)
# =============================================================================
# 相对epoch 30 (绝对207): mAP应达到91.4%
# 相对epoch 60 (绝对237): mAP应达到91.5% (目标达成) ⚡ 学习率第1次衰减
# 相对epoch 100 (绝对277): mAP应尝试突破91.6%
# 相对epoch 120 (绝对297): ⚡ 学习率第2次衰减
# 相对epoch 150+ (绝对327+): 稳定在91.5%+，Rank-1保持94.0%+
#
# 全程监控: Rank-1不能跌破93.8%
# =============================================================================

# =============================================================================
# 【关键调整总结】- 优化版（2026-04-08）
# =============================================================================
# 【原始 → 新值】原因
# 1. BASE_LR: 0.0008 → 0.0012 (提供更多优化动力，避免停滞)
# 2. WARMUP_EPOCHS: 1 → 3 (延长预热，确保稳定起步)
# 3. 新增STEPS: (60, 120) (分段学习率衰减，精细优化)
# 4. 新增LR_DECAY_FACTOR: 0.1 (每次衰减为原10%)
# 5. RE_PROB: 0.35 → 0.25 (减少对已有特征的破坏)
# 6. WEIGHT_DECAY: 0.00015 → 0.0001 (降低约束，增加自由度)
# 7. CENTER_LOSS_WEIGHT: 0.001 → 0.0005 (给特征更多空间)
# 8. MAX_EPOCHS: 350个绝对epoch (调度器使用绝对epoch计数，从0到350)
# =============================================================================